name: Build & Push WebHafen Image

# Baut das Container-Abbild fuer WebHafen und legt es in der GitHub-Registry ab.
# Damit muss das Abbild nie wieder von Hand gebaut und hochgeladen werden:
# ein Push hierher genuegt, danach in Portainer "Recreate" mit
# "Pull latest image" - fertig.
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'Dockerfile'
      - 'entrypoint.sh'
      - 'supervisord.conf'
  # Erlaubt das Bauen auch von Hand ueber den Actions-Reiter auf GitHub.
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/bastild/webhafen:latest
            ghcr.io/bastild/webhafen:${{ github.sha }}
